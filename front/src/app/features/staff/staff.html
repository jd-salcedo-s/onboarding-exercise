<main class="list-page">
    <a class="back-link" routerLink="/dashboard">Back to dashboard</a>

    <h1>Staff</h1>
    <p class="subtitle">View the staff in the Library.</p>

    @if (loading()) {
    <p role="status">Loading staff...</p>
    } @else if (error()) {
    <p role="alert">{{error()}}</p>
    } @else {
    <app-table [columns]="columns" [data]="staff()" />
    }
</main>
