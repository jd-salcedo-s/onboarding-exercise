<main class="list-page">
    <a class="back-link" routerLink="/dashboard">Back to dashboard</a>

    <h1>Books</h1>
    <p class="subtitle">View the books in the Library.</p>

    @if (loading()) {
    <p role="status">Loading books...</p>
    } @else if (error()) {
    <p role="alert">{{error()}}</p>
    } @else {
    <app-table [columns]="columns" [data]="books()" />
    }
</main>
