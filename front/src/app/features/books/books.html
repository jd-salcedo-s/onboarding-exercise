<main class="list-page">
    <a class="back-link" routerLink="/dashboard">Back to dashboard</a>

    <h1>Books</h1>
    <p class="subtitle">View the books in the Library.</p>

    @if (loading()) {
    <p role="status">Loading books...</p>
    } @else if (error()) {
    <p role="alert">{{error()}}</p>
    } @else {
    <app-table [columns]="columns" [data]="books()" entityType="book" />
    }
</main>

<div style="display: flex; flex-direction: row;">
    <div>
        <button></button>
        <h1></h1>
        <p></p>
    </div>
    <div>
        <table></table>
    </div>
</div>
