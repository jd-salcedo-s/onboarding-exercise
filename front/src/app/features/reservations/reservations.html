<main class="list-page">
    <a routerLink="/dashboard"> Back to dashboard</a>

    <h1>Reservations</h1>
    <p class="subtitle">View the reservations in the Library.</p>

    @if (loading()) {
    <p role="status">Loading reservations...</p>
    } @else if (error()) {
    <p role="alert">{{error()}}</p>
    } @else {
    <app-table [columns]="columns" [data]="reservations()" />
    }
</main>
