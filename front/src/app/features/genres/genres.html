<main class="list-page">
    <a class="back-link" routerLink="/dashboard">Back to dashboard</a>

    <h1>Genres</h1>
    <p class="subtitle">View the genres in the Library.</p>

    @if (loading()) {
    <p role="status">Loading genre...</p>
    } @else if (error()) {
    <p role="alert">{{error()}}</p>
    } @else {
    <app-table [columns]="columns" [data]="genres()" entityType="genre" />
    }
</main>
