<main class="list-page">
    <a routerLink="/dashboard"> Back to dashboard</a>

    <h1>Authors</h1>
    <p class="subtitle">View the authors in the Library.</p>

    @if (loading()) {
    <p role="status">Loading authors...</p>
    } @else if (error()) {
    <p role="alert">{{error()}}</p>
    } @else {
    <app-table [columns]="columns" [data]="authors()" />
    }
</main>
