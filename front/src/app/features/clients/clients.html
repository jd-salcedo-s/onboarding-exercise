<main class="list-page">
    <header class="list-header">
        <div class="list-heading">
            <h1>Clients</h1>
            <p class="subtitle">View the clients in the Library.</p>
        </div>
        <a class="back-link" routerLink="/dashboard">Back to dashboard</a>
    </header>

    @if (loading()) {
    <p role="status">Loading clients...</p>
    } @else if (error()) {
    <p role="alert">{{error()}}</p>
    } @else {
    <app-table [columns]="columns" [data]="clients()" entityType="client" />
    }
</main>
