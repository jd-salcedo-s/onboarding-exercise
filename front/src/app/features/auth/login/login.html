<app-form-container title="Login">
  <form class="library-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" autocomplete="username" />

      @if (loginForm.controls.username.hasError('required')) {
      <mat-error>Username is required</mat-error>

      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput [type]="passwordVisible() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
      <button
        class="password-toggle"
        mat-icon-button
        matSuffix
        type="button"
        (click)="passwordVisible.update(visible => !visible)"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="passwordVisible()"
      >
        <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>

      @if (loginForm.controls.password.hasError('required')) {
      <mat-error>Password is required</mat-error>

      }
    </mat-form-field>
    @if (error()) {
    <p class="form-error" role="alert">
      {{error()}}
    </p>
    }

    <app-button [text]="loading() ? 'Signing in...' : 'Sign in'" type="submit" [disabled]="loading()" />

    <p class="bottom-text">

      Don't have an account?
      <a routerLink="/signup">Sign up</a>
    </p>
  </form>
</app-form-container>
